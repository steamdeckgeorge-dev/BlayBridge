<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Form Filler | BlayBridge</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#172c49;font:15px/1.5 system-ui,Arial}header,main{max-width:1150px;margin:auto;padding:16px}header a{color:#1769d2}h1{margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:white;border:1px solid #dbe3ef;border-radius:12px;padding:12px;margin:15px 0}button,input{font:inherit}button{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{background:#e9f1ff}button.primary{background:#1769d2;color:white}button:disabled{opacity:.45;cursor:not-allowed}input[type=number]{width:70px;padding:8px}input[type=color]{width:45px;height:37px}#pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:18px 6px}.page{position:relative;background:white;box-shadow:0 3px 18px #172c492a;max-width:100%;touch-action:pan-y}.page canvas{display:block;max-width:100%;height:auto}.layer{position:absolute;inset:0;pointer-events:auto;cursor:text}.entry{position:absolute;min-width:2px;min-height:1.25em;white-space:pre;line-height:1.25;outline:none;background:transparent;border:1px solid transparent;padding:0;margin:0;resize:none;overflow:visible;pointer-events:auto;touch-action:none;cursor:text;font-family:Helvetica,Arial,sans-serif}.entry.selected{border:1px dashed #1769d2}.entry:focus{border-color:#1769d2}.hint{color:#64748b}.pageBadge{position:absolute;right:6px;bottom:6px;background:#10213acc;color:white;font-size:11px;padding:2px 6px;pointer-events:none}@media(max-width:600px){header,main{padding:10px}.toolbar{gap:6px}button{padding:8px}} .signature{position:absolute;touch-action:none;cursor:move;border:1px dashed #1769d2;background:transparent;pointer-events:auto}.signature img{display:block;width:100%;height:100%;pointer-events:none}dialog{border:1px solid #ccd6e3;border-radius:12px;max-width:95vw}#sigCanvas{border:1px solid #94a3b8;touch-action:none;max-width:100%;background:white}</style></head><body>
<header><a href="/tools/">← Tools</a><h1>Smart Form Filler</h1><div class="hint">Fill PDFs with mouse, keyboard, touchscreen or stylus. Tap a blank area to place text. Drag existing text to move it. Press Enter for a new line.</div></header>
<main><div class="toolbar"><label>Open PDF <input id="file" type="file" accept="application/pdf"></label><label>Size <input id="size" type="number" min="6" max="72" value="14"></label><label>Colour <input id="color" type="color" value="#111111"></label><button id="add">Add text</button><button id="sign">Add signature</button><button id="remove">Delete selected</button><button id="undo">Undo</button><button id="redo">Redo</button><button class="primary" id="save">Download filled PDF</button></div><p id="status" role="status" class="hint">Choose a PDF to begin. Files are processed in your browser.</p><div id="pages"></div><dialog id="sigDialog"><h2>Draw your signature</h2><canvas id="sigCanvas" width="450" height="180"></canvas><div class="toolbar"><button id="sigClear">Clear</button><button id="sigCancel">Cancel</button><button class="primary" id="sigInsert">Place signature</button></div></dialog></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>
(()=>{'use strict';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id),pages=$('pages');let bytes=null,pdf=null,selected=null,history=[],future=[],restoring=false;
const entries=()=>[...document.querySelectorAll('.entry')];const signatures=()=>[...document.querySelectorAll('.signature')];const snap=()=>[...entries().map(e=>({kind:'text',page:+e.dataset.page,x:parseFloat(e.style.left),y:parseFloat(e.style.top),text:e.value,size:+e.dataset.size,color:e.dataset.color})),...signatures().map(e=>({kind:'signature',page:+e.dataset.page,x:parseFloat(e.style.left),y:parseFloat(e.style.top),w:parseFloat(e.style.width),data:e.querySelector('img').src}))];function checkpoint(){if(restoring)return;history.push(JSON.stringify(snap()));if(history.length>120)history.shift();future=[]}
function select(e){if(selected&&selected!==e)selected.classList.remove('selected');selected=e;if(e){e.classList.add('selected');if(e.dataset.size)$('size').value=e.dataset.size;if(e.dataset.color)$('color').value=e.dataset.color}}
function clearSelection(){if(selected)selected.classList.remove('selected');selected=null;document.activeElement?.blur?.()}
function add(page,x,y,txt='',sz=+$('size').value,col=$('color').value,focus=true){const layer=pages.querySelectorAll('.layer')[page];if(!layer)return;const e=document.createElement('textarea');e.className='entry';e.rows=1;e.wrap='off';e.spellcheck=false;e.setAttribute('aria-label','PDF text');e.dataset.page=page;e.dataset.size=sz;e.dataset.color=col;e.style.left=x+'%';e.style.top=y+'%';e.style.fontSize=sz+'px';e.style.color=col;e.value=txt;layer.appendChild(e);resize(e);
e.addEventListener('input',()=>{resize(e);checkpoint()});e.addEventListener('focus',()=>select(e));e.addEventListener('pointerdown',ev=>{ev.stopPropagation();select(e);if(ev.pointerType==='mouse'&&ev.button!==0)return;const r=layer.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,ox=parseFloat(e.style.left),oy=parseFloat(e.style.top);let moved=false;const move=v=>{if(Math.hypot(v.clientX-sx,v.clientY-sy)<5&&!moved)return;moved=true;e.style.left=Math.max(0,Math.min(98,ox+(v.clientX-sx)/r.width*100))+'%';e.style.top=Math.max(0,Math.min(98,oy+(v.clientY-sy)/r.height*100))+'%'};const end=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);if(moved)checkpoint()};if(ev.button===0||ev.pointerType!=='mouse'){window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})}});if(focus){select(e);e.focus()}return e}
function resize(e){const size=+e.dataset.size,lines=e.value.split('\n');const ctx=document.createElement('canvas').getContext('2d');ctx.font=size+'px Helvetica, Arial, sans-serif';const w=Math.max(3,...lines.map(l=>ctx.measureText(l).width+5));e.style.width=w+'px';e.style.height=Math.max(1,lines.length)*size*1.25+3+'px'}
function restore(s){restoring=true;entries().forEach(e=>e.remove());signatures().forEach(e=>e.remove());clearSelection();JSON.parse(s).forEach(o=>o.kind==='signature'?placeSignature(o.page,o.x,o.y,o.w,o.data):add(o.page,o.x,o.y,o.text,o.size,o.color,false));restoring=false}
$('undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(snap()));restore(history.pop())};$('redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(snap()));restore(future.pop())};
$('remove').onclick=()=>{if(selected){checkpoint();selected.remove();selected=null}};
$('size').onchange=()=>{if(selected){checkpoint();selected.dataset.size=$('size').value;selected.style.fontSize=$('size').value+'px';resize(selected)}};
$('color').oninput=()=>{if(selected){selected.dataset.color=$('color').value;selected.style.color=$('color').value}};
const sigCanvas=$('sigCanvas'),ctx=sigCanvas.getContext('2d');let drawing=false;function sigPoint(e){const r=sigCanvas.getBoundingClientRect();return [(e.clientX-r.left)*sigCanvas.width/r.width,(e.clientY-r.top)*sigCanvas.height/r.height]}sigCanvas.addEventListener('pointerdown',e=>{drawing=true;sigCanvas.setPointerCapture(e.pointerId);const [x,y]=sigPoint(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#111';ctx.lineTo(x+.01,y+.01);ctx.stroke()});sigCanvas.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=sigPoint(e);ctx.lineTo(x,y);ctx.stroke()});sigCanvas.addEventListener('pointerup',()=>drawing=false);$('sigClear').onclick=()=>ctx.clearRect(0,0,sigCanvas.width,sigCanvas.height);$('sigCancel').onclick=()=>$('sigDialog').close();$('sign').onclick=()=>{if(!pdf)return alert('Open a PDF first');$('sigDialog').showModal()};function placeSignature(page,x,y,w,data){const layer=pages.querySelectorAll('.layer')[page];if(!layer)return;const el=document.createElement('div');el.className='signature';el.dataset.page=page;el.style.left=x+'%';el.style.top=y+'%';el.style.width=w+'%';el.style.aspectRatio='2.5';const im=document.createElement('img');im.src=data;el.append(im);layer.append(el);el.addEventListener('pointerdown',ev=>{ev.stopPropagation();select(el);const rect=layer.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,ox=parseFloat(el.style.left),oy=parseFloat(el.style.top);const move=v=>{el.style.left=Math.max(0,Math.min(95,ox+(v.clientX-sx)/rect.width*100))+'%';el.style.top=Math.max(0,Math.min(95,oy+(v.clientY-sy)/rect.height*100))+'%'};const end=()=>{window.removeEventListener('pointermove',move);checkpoint()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})});return el}$('sigInsert').onclick=()=>{checkpoint();placeSignature(0,15,20,25,sigCanvas.toDataURL('image/png'));$('sigDialog').close();$('status').textContent='Signature added to first page. Drag it into position.'};$('add').onclick=()=>{if(!pdf)return;checkpoint();add(0,10,10)};
$('file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{bytes=new Uint8Array(await f.arrayBuffer());pdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise;pages.innerHTML='';history=[];future=[];clearSelection();for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),base=p.getViewport({scale:1}),scale=Math.min(1.5,Math.max(.4,(Math.min(window.innerWidth-38,1040))/base.width)),v=p.getViewport({scale});const wrap=document.createElement('div');wrap.className='page';wrap.style.width=v.width+'px';wrap.style.height=v.height+'px';const c=document.createElement('canvas');c.width=Math.round(v.width*devicePixelRatio);c.height=Math.round(v.height*devicePixelRatio);c.style.width=v.width+'px';c.style.height=v.height+'px';await p.render({canvasContext:c.getContext('2d'),viewport:p.getViewport({scale:scale*devicePixelRatio})}).promise;const layer=document.createElement('div');layer.className='layer';layer.addEventListener('pointerdown',event=>{if(event.target!==layer)return;if(selected){clearSelection();return}const r=layer.getBoundingClientRect();checkpoint();add(i-1,(event.clientX-r.left)/r.width*100,(event.clientY-r.top)/r.height*100)});wrap.append(c,layer);const badge=document.createElement('span');badge.className='pageBadge';badge.textContent='Page '+i;wrap.append(badge);pages.append(wrap)}$('status').textContent=pdf.numPages+' page(s) loaded. Click or tap the PDF to add text.'}catch(e){$('status').textContent='Unable to open PDF: '+e.message}};
$('save').onclick=async()=>{if(!bytes)return alert('Open a PDF first');try{const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:false}),font=await doc.embedFont(PDFLib.StandardFonts.Helvetica),all=doc.getPages();for(const e of entries()){const pg=all[+e.dataset.page],sz=+e.dataset.size,x=pg.getWidth()*parseFloat(e.style.left)/100,y=pg.getHeight()*(1-parseFloat(e.style.top)/100)-sz;const hex=e.dataset.color.replace('#',''),rgb=PDFLib.rgb(parseInt(hex.slice(0,2),16)/255,parseInt(hex.slice(2,4),16)/255,parseInt(hex.slice(4,6),16)/255);e.value.split('\n').forEach((line,i)=>{if(line)pg.drawText(line.replace(/[^\x20-\x7E]/g,'?'),{x,y:y-i*sz*1.25,size:sz,font,color:rgb})})}for(const el of signatures()){const pg=all[+el.dataset.page],img=await doc.embedPng(el.querySelector('img').src),w=pg.getWidth()*parseFloat(el.style.width)/100,h=w/2.5;pg.drawImage(img,{x:pg.getWidth()*parseFloat(el.style.left)/100,y:pg.getHeight()*(1-parseFloat(el.style.top)/100)-h,width:w,height:h})}const out=await doc.save(),blob=new Blob([out],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BlayBridge-filled-form.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){alert('Could not export this PDF: '+e.message)}};
})();</script><script defer src="/assets/file-drop.js"></script></body></html>
